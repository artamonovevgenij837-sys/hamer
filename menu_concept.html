<!doctype html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMER — UI Concept 02</title>
<style>
  html,body{margin:0;min-height:100%;background:#05060a;color:#dbe7f3;font-family:system-ui,-apple-system,sans-serif}
  body{display:grid;place-items:center;padding:18px;box-sizing:border-box}
  .wrap{width:min(100%,1200px)}

  p{margin:12px 4px 22px;color:#7f91a6;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="wrap">
    <img src="hamer_logo.png" alt="Hamer wordmark">
    <p>Hamer — custom H wordmark, no box</p>
    <img src="hamer_themes.png" alt="Hamer accent H variants">
    <p>11 accent themes — two-tone diagonal H</p>
    <img src="menu_concept.png" alt="HAMER UI concept">
    <p>Concept 02 — custom H wordmark</p>
  </div>
</body>
</html>
